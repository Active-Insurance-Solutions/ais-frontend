[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content-Security-Policy: completes the 6/6 security-header set the
    # original health check called out. Allowed origins are limited to the
    # exact third parties the site actually loads: Sanity CDN (images +
    # GROQ), Google Fonts (CSS + woff2), Simple Analytics (cookieless
    # tracker), and Google Maps (Contact page iframe). 'unsafe-inline'
    # for style-src is required because Vue components and Tailwind
    # utilities emit inline style attributes; risk is low on a static
    # marketing site with no user-generated HTML.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.sanity.io https://*.simpleanalyticscdn.com; connect-src 'self' https://*.apicdn.sanity.io https://queue.simpleanalyticscdn.com; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
