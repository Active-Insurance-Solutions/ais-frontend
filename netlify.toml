[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content-Security-Policy: completes the 6/6 security-header set the
    # original health check called out. Allowed origins are limited to the
    # exact third parties the site actually loads: Sanity CDN (images +
    # GROQ), Google Fonts (CSS + woff2), Simple Analytics (cookieless
    # tracker), Google Maps (Contact page iframe), and Sentry's US-region
    # ingest endpoint (client-side error reporting). 'unsafe-inline' for
    # style-src is required because Vue components and Tailwind utilities
    # emit inline style attributes; risk is low on a static marketing site
    # with no user-generated HTML.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.sanity.io https://*.simpleanalyticscdn.com; connect-src 'self' https://*.apicdn.sanity.io https://queue.simpleanalyticscdn.com https://*.ingest.us.sentry.io; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dynamic client-routed prefixes need to serve index.html with a 200 status
# so the SPA can boot and resolve the slug. Listed BEFORE the catch-all so
# they match first. If you add more dynamic top-level prefixes, add them
# here too — otherwise they'll fall into the 404 catch-all below.
[[redirects]]
  from = "/portfolio/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/team-projects/*"
  to = "/index.html"
  status = 200

# Catch-all for anything that isn't a prerendered HTML file or a known
# dynamic prefix. Returns 404 so search engines record real not-found
# results instead of indexing the SPA shell as a stale 404. Combined with
# the route-level <meta name="robots" content="noindex"> emitted by
# useSeo for route.name === 'NotFound', this gives both a hard signal
# (HTTP status) and a soft signal (meta robots).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
